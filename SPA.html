<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create New Account</title>
<style>
    
    #logo {
display: block;
align-items: center; 
margin-left: 500px;
margin-right: auto;
width: 50%;

}

    #accountPage {
margin-top: 100px;
display: flex;
flex-direction: column;
align-items: center; 
}
input {
border-radius: 15px;
padding: 10px;
border: 3px solid #000000;
width: 250px;
}
input::placeholder {
color: #000000; 
font-style: italic; 
font-size: 14px; 
}
#role {
border-radius: 100px;
padding: 50px;
border: 3px solid #000000;
width: 250px;
height: 50px;
}
.create-logo {
border-radius: 15px;
padding: 10px;
border: 3px solid #e7bd00;
width: 100px;
background-color: black;
color: #e7bd00;
font-size: 12px;
font-weight: bold;
}
.title-section {
display: flex; 
align-items: center;
flex: 1; 
margin-top: -250px;
margin-right: 20px; 
}


.line {
flex: 1; 
border-top: 4px dashed #000; 
}


.title {
font-size: 1.5; 
margin: 0 15px; 
text-transform: uppercase; 


}


</style>
</head>
<body>
    <div class="account">
        <div id="logo">
        <img src="logoimg.png">
        </div>
        
        <div class="title-section">
        <div class="line"></div>
        <h1 class="title">CREATE NEW ACCOUNT</h1>
        <div class="line"></div>
        </div>
        </div>
        
<!-- Account Creation Page -->
<section id="accountPage" class="page active">

<form id="accountForm">
<input type="text" id="fname" name="fname" placeholder="First Name" required>
<input type="text" id="lname" name="lname" placeholder="Last Name" required><br><br>
<input type="text" id="number" name="number" placeholder="Phone Number" required>
<select name="role" id="role" required>
<option value="" disabled selected>Select Role</option>
<option value="User">User</option>
</select><br><br>
<input type="email" id="email" name="email" placeholder="Email" required>
<input type="text" id="uname" name="uname" placeholder="Username" required><br><br>
<input type="password" id="accountPassword" name="password" placeholder="Password" required>
<button class="create-logo" type="submit">Create!</button><br><br>
</form>
<p>
<a href="#" id="login_link">Already Have An Account</a>
</p>
</section>

</body>
</html>
