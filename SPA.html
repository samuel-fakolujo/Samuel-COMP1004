<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create New Account</title>
<style>
    
    .page {
display: none;
}
.page.active {
display: block;
}
html, body {
height: 100%;
margin: 0;
padding: 0;

}

    #logo {
display: block;
align-items: center; 
margin-left: 500px;
margin-right: auto;
width: 50%;

}

    #accountPage {
margin-top: 100px;
display: flex;
flex-direction: column;
align-items: center; 
}

input {
border-radius: 15px;
padding: 10px;
border: 3px solid #000000;
width: 250px;
}

input::placeholder {
color: #000000; 
font-style: italic; 
font-size: 14px; 
}

#role {
border-radius: 100px;
padding: 50px;
border: 3px solid #000000;
width: 250px;
height: 50px;
}

.create-logo {
border-radius: 15px;
padding: 10px;
border: 3px solid #e7bd00;
width: 100px;
background-color: black;
color: #e7bd00;
font-size: 12px;
font-weight: bold;
}

#loginPage {
margin-top: 100px;
display: flex;
flex-direction: column;
align-items: center; 
}

.logIn-section{
display: flex; 
align-items: center;
flex: 1; 
margin-top: -250px;
margin-right: 20px; 
}

#LogIn_button{
border-radius: 15px;
padding: 10px;
border: 3px solid #e7bd00;
width: 100px;
background-color: black;
color: #e7bd00;
font-size: 12px;
font-weight: bold;
}

.title-section {
display: flex; 
align-items: center;
flex: 1; 
margin-top: -250px;
margin-right: 20px; 
}


.line {
flex: 1; 
border-top: 4px dashed #000; 
}


.title {
font-size: 1.5; 
margin: 0 15px; 
text-transform: uppercase; 


}

#tabsContainer {
display: flex;
flex-direction: row;
flex-wrap: nowrap;
height: 100vh;
background-color: white;
border-right: 1px solid #e7bd00;
}

.tab {
flex: 0 0 200px; 
display: flex;
flex-direction: column;
padding: 20px;
gap: 20px;
font-weight: bold;
background: #f2f2f2;
box-sizing: border-box;
}
.tab button.tablinks {
background: none;
border: none;
text-align: left;
font-size: 18px;
padding: 10px 0;
cursor: pointer;
font-weight: bold;
color: #1a1a1a;
width: 100%;
box-sizing: border-box;
}
.tab button.tablinks:hover,
.tab button.tablinks.active {
color: #e7bd00;
}

#tabContentWrapper {
flex: 1;
padding: 40px;
overflow-y: auto;
background: #fff;
border-left: 1px solid #ccc;
box-sizing: border-box;
}

#tabsContainer {
display: none;
}

.tabcontent {
display: none;
}



</style>
</head>
<body>
    <div class="account">
        <div id="logo">
        <img src="logoimg.png">
        </div>
        
        <div class="title-section">
        <div class="line"></div>
        <h1 class="title">CREATE NEW ACCOUNT</h1>
        <div class="line"></div>
        </div>
        </div>
        
<!-- Account Creation Page -->
<section id="accountPage" class="page active">

<form id="accountForm">
<input type="text" id="fname" name="fname" placeholder="First Name" required>
<input type="text" id="lname" name="lname" placeholder="Last Name" required><br><br>
<input type="text" id="number" name="number" placeholder="Phone Number" required>
<select name="role" id="role" required>
<option value="" disabled selected>Select Role</option>
<option value="User">User</option>
</select><br><br>
<input type="email" id="email" name="email" placeholder="Email" required>
<input type="text" id="uname" name="uname" placeholder="Username" required><br><br>
<input type="password" id="accountPassword" name="password" placeholder="Password" required>
<button class="create-logo" type="submit">Create!</button><br><br>
</form>
<p>
 <a href="#" id="login_link">Already Have An Account?</a>
 </p>    
</section>

<!-- Login Page -->
<section id="loginPage" class="page">
    <div id="logo">
        <img src="logoimg.png">
        </div>
        <div class="logIn-section">
        <div class="line"></div>
        <h1 class="title">LOG IN</h1>
        <div class="line"></div>
        </div>        
    <form id="loginForm">
    <label for="credentials">Email:</label>
    <input type="text" id="credentials" name="credentials" required>
    <br><br>
    <label for="loginPassword">Password:</label>
    <input type="password" id="loginPassword" name="password" required>
    <br><br>
    <button id="LogIn_button" type="submit">Log In</button>
    <p>
        <a href="#" id="create_account_link">Don't Have An Account? Create one now!</a>
     </p>        
    </form>
    </section>
    <!-- Tabs -->
<div id="tabsContainer">
    <div class="tab">
    <button class="tablinks" onclick="openTab(event, 'home')" id="defaultOpen">Home</button>
    <button class="tablinks" onclick="openTab(event, 'tasks')">Tasks</button>
    <button class="tablinks" onclick="openTab(event, 'history')">History</button>
    <button class="tablinks" onclick="openTab(event, 'how_to_use')">How-To-Use</button>
    <button class="tablinks" onclick="openTab(event, 'origin')">Origin</button>
    <button id="logoutButton" type="button">Log Out</button>
    </div>
    


<script>
    // Handle the Create Account Design for it not to show on every page
    function toggleAccountHeader(show) {
document.querySelector(".account").style.display = show ? "block" : "none";
}

 // Handle account creation form submission
document.getElementById("accountForm").addEventListener("submit", function(event) {
event.preventDefault();
saveAccountData();
displayLines();
localStorage.setItem("loggedIn", "true");
document.getElementById("accountPage").classList.remove("active");
document.getElementById("accountPage").style.display = "none";
toggleAccountHeader(false);
document.getElementById("tabsContainer").style.display = "flex";
displayLines();
document.getElementById("defaultOpen").click();
document.getElementById("homepage").classList.add("active");
});

// Save account data during registration
function saveAccountData() {
let accountData = {
firstName: document.getElementById("fname").value,
lastName: document.getElementById("lname").value,
phoneNumber: document.getElementById("number").value,
role: document.getElementById("role").value,
email: document.getElementById("email").value,
username: document.getElementById("uname").value,
password: document.getElementById("accountPassword").value
};
localStorage.setItem("accountData", JSON.stringify(accountData));
}

// Navigation between login and create account pages
document.getElementById("login_link").addEventListener("click", function(event) {
event.preventDefault();
toggleAccountHeader(false);
document.getElementById("accountPage").style.display = "none";
document.getElementById("loginPage").style.display = "block";
});

document.getElementById("create_account_link").addEventListener("click", function(event) {
event.preventDefault();
toggleAccountHeader(true);
document.getElementById("loginPage").style.display = "none";
document.getElementById("accountPage").style.display = "block";
});

// Handle login form submission and load saved account data
document.getElementById("loginForm").addEventListener("submit", function(event) {
event.preventDefault();
let enteredCredential = document.getElementById("credentials").value;
let enteredPassword = document.getElementById("loginPassword").value;
let accountData = JSON.parse(localStorage.getItem("accountData"));
if (accountData && 
(accountData.username === enteredCredential || accountData.email === enteredCredential) &&
accountData.password === enteredPassword) {
localStorage.setItem("loggedIn", "true");
document.getElementById("loginPage").style.display = "none";
document.getElementById("tabsContainer").style.display = "flex";
loadAccountData();
document.getElementById("defaultOpen").click();
document.getElementById("homepage").classList.add("active");
} else {
alert("Invalid username/email or password. Please try again.");
}
});


</script>
</body>
</html>
